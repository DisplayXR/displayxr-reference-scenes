name: build-packs
# Build the redistributed scene packs from their PINNED upstream sources and
# attach them to a DRAFT release. Publishing the draft is a deliberate, manual
# step: it is the moment ASWF-licensed content is redistributed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create as a draft (e.g. v0.1.0)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install usd-core numpy pillow tifffile imagecodecs fast-simplification
      - name: Validate
        run: python3 scripts/validate.py
      - name: Build OpenPBR Shader Playground packs
        run: scripts/build_playground.sh out
      - name: Build OpenPBR swatch pack
        run: scripts/build_swatches.sh out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --draft --target "${{ github.sha }}" \
            --title "Reference scenes ${{ inputs.tag }}" \
            --notes "Packs built from pinned upstream sources by build-packs. Each pack carries its licence, notice and MODIFICATIONS.md. See NOTICE.md." \
            out/openpbr-shader-playground-usd.zip out/openpbr-shader-playground.glb \
            out/openpbr-swatches-usd.zip out/SHA256SUMS \
            scenes/displayxr-material-tests/assets/*.glb \
            scenes/displayxr-display-tests/assets/*.glb
